<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中壢污水大作戰</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Noto Sans TC 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- WebAudio-TinySynth MIDI 合成播放器庫 -->
    <script src="https://g200kg.github.io/webaudio-tinysynth/webaudio-tinysynth.js"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 浮動動畫效果 (LOGO 與 角色) */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        @keyframes float-bird {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.04); filter: brightness(1.12); }
        }

        .animate-float {
            animation: float-slow 4s ease-in-out infinite;
        }

        .animate-bird {
            animation: float-bird 3.5s ease-in-out infinite;
        }

        .animate-pulse-btn {
            animation: pulse-btn 2.2s ease-in-out infinite;
        }

        /* 遊戲按鈕立體光澤視覺效果 */
        .game-btn-glow {
            background: linear-gradient(180deg, #ffbe33 0%, #ff8800 45%, #e65100 100%);
            box-shadow: 
                0 8px 0 #9a3412,
                0 15px 20px rgba(0, 0, 0, 0.4),
                inset 0 4px 6px rgba(255, 255, 255, 0.6),
                inset 0 -4px 6px rgba(0, 0, 0, 0.3);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .game-btn-glow:hover {
            background: linear-gradient(180deg, #ffd166 0%, #ffa114 45%, #f56c00 100%);
            box-shadow: 
                0 10px 0 #9a3412,
                0 20px 25px rgba(0, 0, 0, 0.5),
                inset 0 4px 8px rgba(255, 255, 255, 0.8),
                inset 0 -4px 6px rgba(0, 0, 0, 0.3);
        }

        .game-btn-glow:active {
            transform: translateY(6px) !important;
            box-shadow: 
                0 2px 0 #9a3412,
                0 5px 10px rgba(0, 0, 0, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-900 w-screen h-screen relative flex flex-col justify-between items-center overflow-hidden">

    <!-- 1. 背景圖片 -->
    <div class="absolute inset-0 w-full h-full z-0">
        <img 
            src="https://wolfharry.github.io/test20260818/img/bg.png" 
            alt="中壢污水大作戰背景" 
            class="w-full h-full object-cover object-center pointer-events-none"
            onerror="this.src='https://placehold.co/1920x1080/0284c7/ffffff?text=Background+Image';"
        />
    </div>

    <!-- 右上角音樂控制按鈕 -->
    <div class="absolute top-4 right-4 md:top-6 md:right-6 z-40">
        <button 
            id="btn-toggle-bgm"
            class="bg-black/40 hover:bg-black/60 backdrop-blur-md text-white border border-white/30 px-4 py-2 rounded-full flex items-center gap-2 shadow-lg transition-all active:scale-95 cursor-pointer"
            title="開關背景音樂"
        >
            <i id="bgm-icon" class="fa-solid fa-volume-xmark text-amber-400 text-base"></i>
            <span id="bgm-text" class="text-xs md:text-sm font-bold tracking-wider text-amber-300">音樂：OFF</span>
        </button>
    </div>

    <!-- 提示消息彈窗 Toast -->
    <div 
        id="toast-message" 
        class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white px-6 py-3 rounded-2xl shadow-2xl border border-amber-400/50 flex items-center gap-3 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none"
    >
        <i id="toast-icon" class="fa-solid fa-circle-check text-amber-400 text-lg"></i>
        <span id="toast-text" class="font-bold text-sm md:text-base tracking-wide">提示訊息</span>
    </div>

    <!-- 2. 中間上方 LOGO -->
    <div class="relative z-10 w-full flex justify-center pt-4 md:pt-8 px-4 pointer-events-none">
        <img 
            src="https://wolfharry.github.io/test20260818/img/title.png" 
            alt="中壢污水大作戰 LOGO" 
            class="w-[82vw] sm:w-[70vw] md:w-[60vw] max-w-[680px] h-auto drop-shadow-[0_10px_15px_rgba(0,0,0,0.3)] animate-float"
            onerror="this.src='https://placehold.co/600x250/0284c7/ffffff?text=中壢污水大作戰';"
        />
    </div>

    <!-- 3. 左下角白鳥角色 (已依要求顯著放大) -->
    <div class="absolute left-0 bottom-0 z-20 pointer-events-none max-w-[55%] sm:max-w-[48%] md:max-w-[42%] lg:max-w-[38%] xl:max-w-[620px] transition-all duration-300">
        <img 
            src="https://wolfharry.github.io/test20260818/img/bird.png" 
            alt="白鳥角色" 
            class="w-full h-auto drop-shadow-[0_12px_20px_rgba(0,0,0,0.4)] animate-bird transform -translate-x-2 translate-y-2"
            onerror="this.src='https://placehold.co/400x400/ffffff/000000?text=White+Bird';"
        />
    </div>

    <!-- 4. 右下角人物角色 (阿澤) -->
    <div class="absolute right-0 bottom-0 z-20 pointer-events-none max-w-[48%] sm:max-w-[42%] md:max-w-[36%] lg:max-w-[32%] xl:max-w-[520px] transition-all duration-300">
        <img 
            src="https://wolfharry.github.io/test20260818/img/character.png" 
            alt="工程師阿澤" 
            class="w-full h-auto drop-shadow-[0_12px_20px_rgba(0,0,0,0.4)] transform translate-x-2 translate-y-2"
            onerror="this.src='https://placehold.co/400x500/1e40af/ffffff?text=Engineer';"
        />
    </div>

    <!-- 5. 中間下方按鈕 (開始遊戲) -->
    <div class="absolute bottom-[10%] sm:bottom-[12%] md:bottom-[14%] left-1/2 -translate-x-1/2 z-30">
        <button 
            id="btn-start-game"
            class="game-btn-glow border-4 border-amber-200/90 text-white font-black text-2xl sm:text-3xl md:text-4xl px-8 sm:px-12 md:px-16 py-3 sm:py-4 md:py-5 rounded-full tracking-wider transition-all duration-200 animate-pulse-btn cursor-pointer flex items-center justify-center gap-3 active:scale-95"
        >
            <span>開始遊戲</span>
        </button>
    </div>

    <script>
        /* -------------------------------------------------------------
         * 提示訊息 Toast 控制器
         * ------------------------------------------------------------- */
        function showToast(message, iconClass = "fa-circle-check text-amber-400") {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');

            if (!toast) return;

            toastText.innerText = message;
            toastIcon.className = `fa-solid ${iconClass} text-lg`;

            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2600);
        }

        /* -------------------------------------------------------------
         * 背景音樂控制器 (MIDI 音樂: Str2010.mid)
         * 採用 WebAudio-TinySynth 引擎播放
         * ------------------------------------------------------------- */
        const BGM_URL = "https://wolfharry.github.io/test20260818/Str2010.mid";
        let isBgmPlaying = false;
        let midiSynth = null;
        let midiBuffer = null;
        let isMidiLoaded = false;

        // 初始化 TinySynth 合成器
        function initSynth() {
            try {
                if (!midiSynth && typeof WebAudioTinySynth !== 'undefined') {
                    midiSynth = new WebAudioTinySynth({
                        quality: 1,   // 高音質 FM 合成
                        useReverb: 1, // 開啟殘響
                        voices: 64
                    });
                    midiSynth.setLoop(1);       // 自動循環
                    midiSynth.setMasterVol(0.6); // 主音量
                }
            } catch (err) {
                console.warn("Synth 初始化提醒:", err);
            }
        }

        // 預先載入 MIDI 二進位檔案數據
        function preloadMidiFile() {
            fetch(BGM_URL)
                .then(res => {
                    if (!res.ok) throw new Error("MIDI 下載失敗");
                    return res.arrayBuffer();
                })
                .then(buf => {
                    midiBuffer = buf;
                    isMidiLoaded = true;
                    initSynth();
                    if (midiSynth) {
                        midiSynth.loadMIDI(midiBuffer);
                    }
                })
                .catch(err => {
                    console.warn("MIDI 檔案預載警告:", err);
                });
        }

        // 解鎖瀏覽器音訊 AudioContext (需要使用者點擊互動)
        function unlockAudioContext() {
            initSynth();
            if (midiSynth && midiSynth.audioContext) {
                if (midiSynth.audioContext.state === 'suspended') {
                    midiSynth.audioContext.resume();
                }
            }
        }

        // 開始播放 MIDI BGM
        function startBgm() {
            unlockAudioContext();
            if (isBgmPlaying) return;

            isBgmPlaying = true;

            if (midiSynth) {
                if (isMidiLoaded && midiBuffer) {
                    midiSynth.loadMIDI(midiBuffer);
                    midiSynth.playMIDI();
                } else {
                    fetch(BGM_URL)
                        .then(res => res.arrayBuffer())
                        .then(buf => {
                            midiBuffer = buf;
                            isMidiLoaded = true;
                            midiSynth.loadMIDI(buf);
                            midiSynth.playMIDI();
                        })
                        .catch(err => console.error("播放 MIDI 錯誤:", err));
                }
            }

            // 更新 UI 圖示
            const bgmIcon = document.getElementById('bgm-icon');
            const bgmText = document.getElementById('bgm-text');
            if (bgmIcon && bgmText) {
                bgmIcon.className = 'fa-solid fa-volume-high text-emerald-400 text-base animate-pulse';
                bgmText.innerText = '音樂：ON';
                bgmText.className = 'text-xs md:text-sm font-bold tracking-wider text-emerald-300';
            }
        }

        // 停止播放 BGM
        function stopBgm() {
            isBgmPlaying = false;

            if (midiSynth) {
                midiSynth.stopMIDI();
            }

            // 更新 UI 圖示
            const bgmIcon = document.getElementById('bgm-icon');
            const bgmText = document.getElementById('bgm-text');
            if (bgmIcon && bgmText) {
                bgmIcon.className = 'fa-solid fa-volume-xmark text-amber-400 text-base';
                bgmText.innerText = '音樂：OFF';
                bgmText.className = 'text-xs md:text-sm font-bold tracking-wider text-amber-300';
            }
        }

        // 切換音樂開關
        function toggleBgm() {
            if (isBgmPlaying) {
                stopBgm();
                showToast("音樂已關閉", "fa-volume-xmark text-slate-400");
            } else {
                startBgm();
                showToast("🎵 背景音樂播放中！", "fa-music text-emerald-400");
            }
        }

        // 點擊按鈕音效 (SFX)
        function playStartSfx() {
            unlockAudioContext();
            if (!midiSynth || !midiSynth.audioContext) return;
            try {
                const ctx = midiSynth.audioContext;
                const now = ctx.currentTime;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            } catch (e) {
                console.log("SFX 播放跳過");
            }
        }

        // 頁面DOMContentLoaded 初始化
        window.addEventListener('DOMContentLoaded', () => {
            preloadMidiFile();

            // 綁定按鈕事件
            const btnBgm = document.getElementById('btn-toggle-bgm');
            if (btnBgm) btnBgm.addEventListener('click', toggleBgm);

            const btnStart = document.getElementById('btn-start-game');
            if (btnStart) {
                btnStart.addEventListener('click', () => {
                    playStartSfx();
                    if (!isBgmPlaying) {
                        startBgm();
                    }
                    showToast("🎮 遊戲載入中，即將開始！", "fa-circle-play text-amber-400");
                });
            }
        });
    </script>
</body>
</html>
