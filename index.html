<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中壢污水大作戰</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Noto Sans TC 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- WebAudio-TinySynth MIDI 合成播放器庫 -->
    <script src="https://g200kg.github.io/webaudio-tinysynth/webaudio-tinysynth.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0b0f19;
        }

        /* 阿澤揮舞板手與律動動畫 */
        @keyframes azew-swing {
            0%, 100% {
                transform: rotate(0deg) translateY(12px) scale(1);
            }
            25% {
                transform: rotate(-4deg) translateY(4px) scale(1.02);
            }
            50% {
                transform: rotate(6deg) translateY(-2px) scale(1.04);
            }
            75% {
                transform: rotate(-2deg) translateY(8px) scale(1.01);
            }
        }

        /* 白鳥輕快浮動動畫 */
        @keyframes bird-dance {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-16px) rotate(-3deg) scale(1.03);
            }
        }

        /* LOGO 浮動動畫 */
        @keyframes logo-float {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.02);
            }
        }

        /* 按鈕呼吸燈 */
        @keyframes pulse-btn {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1) drop-shadow(0 0 10px rgba(255,190,51,0.4));
            }
            50% {
                transform: scale(1.05);
                filter: brightness(1.15) drop-shadow(0 0 22px rgba(255,190,51,0.8));
            }
        }

        /* 畫面震撼抖動效果 (按下開始遊戲時觸發) */
        @keyframes screen-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-12px, -8px) rotate(-1deg); }
            20% { transform: translate(10px, 8px) rotate(1.5deg); }
            30% { transform: translate(-8px, 6px) rotate(-1deg); }
            40% { transform: translate(6px, -6px) rotate(1deg); }
            50% { transform: translate(-4px, 4px) rotate(-0.5deg); }
            60% { transform: translate(3px, -2px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .animate-logo {
            animation: logo-float 4s ease-in-out infinite;
            transform-origin: center center;
        }

        .animate-bird {
            animation: bird-dance 3.2s ease-in-out infinite;
            transform-origin: bottom left;
        }

        /* 阿澤揮舞板手動畫，旋轉中心設在右下角，模擬揮臂 */
        .animate-azew {
            animation: azew-swing 2.8s ease-in-out infinite;
            transform-origin: 80% 90%;
        }

        .animate-btn {
            animation: pulse-btn 2.2s ease-in-out infinite;
        }

        .do-shake {
            animation: screen-shake 0.65s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 遊戲按鈕立體光澤視覺效果 */
        .game-btn-glow {
            background: linear-gradient(180deg, #ffbe33 0%, #ff8800 45%, #e65100 100%);
            box-shadow: 
                0 8px 0 #9a3412,
                0 15px 25px rgba(0, 0, 0, 0.5),
                inset 0 4px 6px rgba(255, 255, 255, 0.7),
                inset 0 -4px 6px rgba(0, 0, 0, 0.4);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .game-btn-glow:hover {
            background: linear-gradient(180deg, #ffd166 0%, #ffa114 45%, #f56c00 100%);
            box-shadow: 
                0 10px 0 #9a3412,
                0 20px 30px rgba(0, 0, 0, 0.6),
                inset 0 4px 8px rgba(255, 255, 255, 0.9),
                inset 0 -4px 6px rgba(0, 0, 0, 0.4);
        }

        .game-btn-glow:active {
            transform: translateY(6px) scale(0.97) !important;
            box-shadow: 
                0 2px 0 #9a3412,
                0 5px 10px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="w-screen h-screen flex justify-center items-center relative overflow-hidden bg-slate-950">

    <!-- 震撼視覺白色閃光疊加層 -->
    <div id="flash-overlay" class="fixed inset-0 bg-white opacity-0 pointer-events-none z-50 transition-opacity duration-300"></div>

    <!-- 右上角音樂控制按鈕 -->
    <div class="fixed top-4 right-4 md:top-6 md:right-6 z-40">
        <button 
            id="btn-toggle-bgm"
            class="bg-black/50 hover:bg-black/80 backdrop-blur-md text-white border border-amber-400/40 px-4 py-2 rounded-full flex items-center gap-2 shadow-2xl transition-all active:scale-95 cursor-pointer"
            title="開關背景音樂"
        >
            <i id="bgm-icon" class="fa-solid fa-volume-xmark text-amber-400 text-base"></i>
            <span id="bgm-text" class="text-xs md:text-sm font-bold tracking-wider text-amber-300">音樂：OFF</span>
        </button>
    </div>

    <!-- 提示消息彈窗 Toast -->
    <div 
        id="toast-message" 
        class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white px-6 py-3 rounded-2xl shadow-2xl border border-amber-400/60 flex items-center gap-3 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none"
    >
        <i id="toast-icon" class="fa-solid fa-circle-check text-amber-400 text-lg"></i>
        <span id="toast-text" class="font-bold text-sm md:text-base tracking-wide">提示訊息</span>
    </div>

    <!-- ========================================================================= -->
    <!-- 全螢幕遊戲舞台 (滿版無黑邊)                                                -->
    <!-- ========================================================================= -->
    <div id="game-stage" class="relative w-full h-full overflow-hidden">

        <!-- 1. 背景圖片 (滿版裁切不留黑邊) -->
        <img 
            src="https://wolfharry.github.io/test20260818/img/bg.png" 
            alt="背景" 
            class="absolute inset-0 w-full h-full object-cover pointer-events-none z-0"
            onerror="this.src='https://placehold.co/1920x1080/0284c7/ffffff?text=Background';"
        />

        <!-- 2. 中間上方 LOGO -->
        <div id="logo-container" class="absolute top-[5%] left-1/2 -translate-x-1/2 w-[48%] max-w-[620px] z-10 pointer-events-none flex justify-center transition-transform duration-75">
            <img 
                id="img-logo"
                src="https://wolfharry.github.io/test20260818/img/title.png" 
                alt="中壢污水大作戰 LOGO" 
                class="w-full h-auto drop-shadow-[0_12px_20px_rgba(0,0,0,0.35)] animate-logo"
            />
        </div>

        <!-- 3. 左下角白鳥角色 (精緻縮小比例) -->
        <div id="bird-container" class="absolute left-0 bottom-0 w-[30%] max-w-[420px] min-w-[200px] z-20 pointer-events-none transition-transform duration-75">
            <img 
                id="img-bird"
                src="https://wolfharry.github.io/test20260818/img/bird.png" 
                alt="白鳥角色" 
                class="w-full h-auto drop-shadow-[0_15px_25px_rgba(0,0,0,0.45)] animate-bird transform -translate-x-2 translate-y-2"
            />
        </div>

        <!-- 4. 右下角人物角色 (阿澤) - 縮小比例並往下挪避免露底破綻 -->
        <div id="azew-container" class="absolute right-[1%] -bottom-[2%] w-[26%] max-w-[360px] min-w-[180px] z-20 pointer-events-none transition-transform duration-75">
            <img 
                id="img-azew"
                src="https://wolfharry.github.io/test20260818/img/character.png" 
                alt="工程師阿澤" 
                class="w-full h-auto drop-shadow-[0_15px_25px_rgba(0,0,0,0.45)] animate-azew transform translate-x-2 translate-y-4"
            />
        </div>

        <!-- 5. 中間下方按鈕 (開始遊戲) -->
        <div id="btn-container" class="absolute bottom-[8%] left-1/2 -translate-x-1/2 w-[28%] max-w-[320px] min-w-[180px] z-30 transition-transform duration-75">
            <button 
                id="btn-start-game"
                class="w-full game-btn-glow border-4 border-amber-200/90 text-white font-black text-[2.8vw] lg:text-[30px] md:text-[24px] sm:text-[18px] py-[2.2%] rounded-full tracking-wider transition-all duration-200 animate-btn cursor-pointer flex items-center justify-center gap-2 active:scale-95"
            >
                <span>開始遊戲</span>
            </button>
        </div>

    </div>

    <script>
        /* -------------------------------------------------------------
         * 提示訊息 Toast 控制器
         * ------------------------------------------------------------- */
        function showToast(message, iconClass = "fa-circle-check text-amber-400") {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');

            if (!toast) return;

            toastText.innerText = message;
            toastIcon.className = `fa-solid ${iconClass} text-lg`;

            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2600);
        }

        /* -------------------------------------------------------------
         * MIDI 背景音樂 & WebAudio 分析器 (AnalyserNode) 節奏同步
         * ------------------------------------------------------------- */
        const BGM_URL = "https://wolfharry.github.io/test20260818/Str2010.mid";
        let isBgmPlaying = false;
        let midiSynth = null;
        let midiBuffer = null;
        let analyserNode = null;
        let animFrameId = null;

        // 初始化 TinySynth 與 Web Audio Analyser
        function initSynth() {
            try {
                if (!midiSynth && typeof WebAudioTinySynth !== 'undefined') {
                    midiSynth = new WebAudioTinySynth({
                        quality: 1,   // 高音質 FM 合成
                        useReverb: 1, // 開啟殘響
                        voices: 64
                    });
                    midiSynth.setLoop(1);       // 循環播放
                    midiSynth.setMasterVol(0.6); // 音量設定

                    // 設定 AnalyserNode 進行即時頻譜/重音分析
                    if (midiSynth.audioContext) {
                        analyserNode = midiSynth.audioContext.createAnalyser();
                        analyserNode.fftSize = 64;
                        if (midiSynth.out) {
                            midiSynth.out.connect(analyserNode);
                        }
                    }
                }
            } catch (err) {
                console.warn("Synth 初始化提醒:", err);
            }
        }

        // 預先載入 MIDI
        function preloadMidiFile() {
            fetch(BGM_URL)
                .then(res => res.arrayBuffer())
                .then(buf => {
                    midiBuffer = buf;
                    initSynth();
                    if (midiSynth && midiBuffer) {
                        midiSynth.loadMIDI(midiBuffer);
                    }
                })
                .catch(err => console.warn("MIDI 載入失敗:", err));
        }

        // 解鎖 AudioContext
        function unlockAudioContext() {
            initSynth();
            if (midiSynth && midiSynth.audioContext) {
                if (midiSynth.audioContext.state === 'suspended') {
                    midiSynth.audioContext.resume();
                }
            }
        }

        // 即時聽取音樂重音，更新阿澤、白鳥與 Logo 的彈跳與揮臂動態
        function startBeatAnalysisLoop() {
            const dataArray = new Uint8Array(32);
            const imgAzew = document.getElementById('azew-container');
            const imgBird = document.getElementById('bird-container');
            const imgLogo = document.getElementById('logo-container');

            function updateBeat() {
                if (!isBgmPlaying) {
                    // 停止音樂時歸位
                    if (imgAzew) imgAzew.style.transform = '';
                    if (imgBird) imgBird.style.transform = '';
                    if (imgLogo) imgLogo.style.transform = '';
                    return;
                }

                let bassPower = 0;
                if (analyserNode) {
                    analyserNode.getByteFrequencyData(dataArray);
                    // 計算低頻重音 (Bass Energy)
                    bassPower = (dataArray[1] + dataArray[2] + dataArray[3] + dataArray[4]) / 4;
                } else {
                    // 備用律動 (模擬 120BPM 重音)
                    bassPower = 100 + Math.sin(Date.now() / 150) * 80;
                }

                const beatScale = bassPower / 255; // 0 ~ 1

                // 1. 阿澤重音跳躍與揮舞板手 (保持底部偏移避免破綻)
                if (imgAzew && beatScale > 0.25) {
                    const azewJump = beatScale * 14; // 向上跳躍 px
                    const azewRotate = (beatScale - 0.25) * 12; // 板手揮舞角度
                    imgAzew.style.transform = `translateY(${14 - azewJump}px) rotate(${azewRotate}deg) scale(${1 + beatScale * 0.04})`;
                }

                // 2. 白鳥歡快跟著重音晃動
                if (imgBird && beatScale > 0.3) {
                    const birdJump = beatScale * 14;
                    imgBird.style.transform = `translateY(-${birdJump}px) rotate(-${beatScale * 8}deg)`;
                }

                // 3. LOGO 隨著低音衝擊微幅放大
                if (imgLogo && beatScale > 0.35) {
                    imgLogo.style.transform = `translateX(-50%) scale(${1 + beatScale * 0.04})`;
                }

                animFrameId = requestAnimationFrame(updateBeat);
            }

            updateBeat();
        }

        // 開始播放 BGM
        function startBgm() {
            unlockAudioContext();
            if (isBgmPlaying) return;

            isBgmPlaying = true;

            if (midiSynth) {
                if (midiBuffer) {
                    midiSynth.loadMIDI(midiBuffer);
                    midiSynth.playMIDI();
                } else {
                    fetch(BGM_URL)
                        .then(res => res.arrayBuffer())
                        .then(buf => {
                            midiBuffer = buf;
                            midiSynth.loadMIDI(buf);
                            midiSynth.playMIDI();
                        });
                }
            }

            startBeatAnalysisLoop();

            // 更新 UI 圖示
            const bgmIcon = document.getElementById('bgm-icon');
            const bgmText = document.getElementById('bgm-text');
            if (bgmIcon && bgmText) {
                bgmIcon.className = 'fa-solid fa-volume-high text-emerald-400 text-base animate-pulse';
                bgmText.innerText = '音樂：ON';
                bgmText.className = 'text-xs md:text-sm font-bold tracking-wider text-emerald-300';
            }
        }

        // 停止播放 BGM
        function stopBgm() {
            isBgmPlaying = false;
            if (animFrameId) cancelAnimationFrame(animFrameId);

            if (midiSynth) {
                midiSynth.stopMIDI();
            }

            // 重置動態 style
            const imgAzew = document.getElementById('azew-container');
            const imgBird = document.getElementById('bird-container');
            const imgLogo = document.getElementById('logo-container');
            if (imgAzew) imgAzew.style.transform = '';
            if (imgBird) imgBird.style.transform = '';
            if (imgLogo) imgLogo.style.transform = '';

            // 更新 UI 圖示
            const bgmIcon = document.getElementById('bgm-icon');
            const bgmText = document.getElementById('bgm-text');
            if (bgmIcon && bgmText) {
                bgmIcon.className = 'fa-solid fa-volume-xmark text-amber-400 text-base';
                bgmText.innerText = '音樂：OFF';
                bgmText.className = 'text-xs md:text-sm font-bold tracking-wider text-amber-300';
            }
        }

        // 切換音樂
        function toggleBgm() {
            if (isBgmPlaying) {
                stopBgm();
                showToast("背景音樂已關閉", "fa-volume-xmark text-slate-400");
            } else {
                startBgm();
                showToast("🎵 演奏中！阿澤與白鳥跟著重音跳舞囉！", "fa-music text-emerald-400");
            }
        }

        /* -------------------------------------------------------------
         * 超震撼衝擊效果音 (Impact Start SFX) + 畫面震撼閃光
         * 採用 Web Audio API 多重合成 (Sub-Bass Boom + Explosive Synth)
         * ------------------------------------------------------------- */
        function triggerShockingImpactSfx() {
            unlockAudioContext();
            if (!midiSynth || !midiSynth.audioContext) return;

            try {
                const ctx = midiSynth.audioContext;
                const now = ctx.currentTime;

                // 1. 低音砲 Boom 音效 (220Hz 驟降至 25Hz)
                const bassOsc = ctx.createOscillator();
                const bassGain = ctx.createGain();

                bassOsc.type = 'sine';
                bassOsc.frequency.setValueAtTime(240, now);
                bassOsc.frequency.exponentialRampToValueAtTime(28, now + 0.8);

                bassGain.gain.setValueAtTime(0.85, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

                bassOsc.connect(bassGain);
                bassGain.connect(ctx.destination);
                bassOsc.start(now);
                bassOsc.stop(now + 0.85);

                // 2. 遊戲開場升音階和絃 (C Major Power Chord: C4, E4, G4, C5, E5)
                const freqs = [261.63, 329.63, 392.00, 523.25, 659.25];
                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.04);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.setValueAtTime(0.22, now + idx * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7 + idx * 0.04);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + idx * 0.04);
                    osc.stop(now + 0.75 + idx * 0.04);
                });

                // 3. 畫面震動 & 閃光視覺震撼效果
                const stage = document.getElementById('game-stage');
                const flash = document.getElementById('flash-overlay');

                if (stage) {
                    stage.classList.remove('do-shake');
                    void stage.offsetWidth; // 強制重繪
                    stage.classList.add('do-shake');
                    setTimeout(() => stage.classList.remove('do-shake'), 700);
                }

                if (flash) {
                    flash.style.opacity = '0.75';
                    setTimeout(() => { flash.style.opacity = '0'; }, 250);
                }

            } catch (e) {
                console.warn("震撼音效播放例外處理:", e);
            }
        }

        /* -------------------------------------------------------------
         * 頁面 DOM 載入完畢初始化
         * ------------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', () => {
            preloadMidiFile();

            // 綁定音樂開關
            const btnBgm = document.getElementById('btn-toggle-bgm');
            if (btnBgm) btnBgm.addEventListener('click', toggleBgm);

            // 綁定「開始遊戲」按鈕
            const btnStart = document.getElementById('btn-start-game');
            if (btnStart) {
                btnStart.addEventListener('click', () => {
                    triggerShockingImpactSfx();

                    if (!isBgmPlaying) {
                        startBgm();
                    }

                    showToast("💥 污水大作戰啟動！準備進入遊戲！", "fa-bolt text-amber-400");
                });
            }
        });
    </script>
</body>
</html>
